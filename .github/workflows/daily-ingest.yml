name: Daily public-domain stills

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/ingest.ts --photos --art --count=100
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: ingest daily public-domain images"
          file_pattern: |
            data/catalog.json
            public/stills/**
